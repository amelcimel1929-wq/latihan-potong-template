services:
  web:
    build: .
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
      # index.php includes ../sb-admin2CV/connection.php, so mount it as a sibling
      - ../sb-admin2CV:/var/www/sb-admin2CV:ro
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: profile-cv
    networks:
      - default

networks:
  default:
    external: true
    name: cv-shared-network
